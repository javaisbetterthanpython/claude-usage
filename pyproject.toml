[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-usage-limits"
version = "0.2.0"
description = "CLI for Claude subscription weekly usage and model limits, with status-line output and warning thresholds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "claude-usage contributors" }]
keywords = ["claude", "claude-code", "anthropic", "usage", "rate-limit", "weekly-usage", "subscription", "statusline", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
claude-usage = "claude_usage.cli:main"

[project.urls]
Homepage = "https://github.com/javaisbetterthanpython/claude-usage"
Issues = "https://github.com/javaisbetterthanpython/claude-usage/issues"

[tool.setuptools.packages.find]
where = ["src"]
