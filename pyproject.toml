[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-limits"
version = "0.1.0"
description = "CLI for your Claude subscription rate limits: the 5-hour and 7-day usage windows Claude Code shows in /usage, from your terminal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "claude-usage contributors" }]
keywords = ["claude", "claude-code", "anthropic", "usage", "rate-limit", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
claude-usage = "claude_usage.cli:main"

[project.urls]
Homepage = "https://github.com/javaisbetterthanpython/claude-usage"
Issues = "https://github.com/javaisbetterthanpython/claude-usage/issues"

[tool.setuptools.packages.find]
where = ["src"]
